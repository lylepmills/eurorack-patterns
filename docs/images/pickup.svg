<svg xmlns="http://www.w3.org/2000/svg" width="920" height="302" viewBox="0 0 920 302" role="img" aria-labelledby="title desc">
<title id="title">Hold the stored value until the knob reaches it</title><desc id="desc">Synthetic travel in percent. Stored target: 30. A coarse move crosses it at sample 6. Orange: Apply every knob sample. Blue: Apply after pickup.</desc>
