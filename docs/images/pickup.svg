<path d="M68.00 192.20 H182.57 V192.20 H297.14 V192.20 H411.71 V192.20 H526.29 V192.20 H640.86 V192.20 H755.43 V204.80 H870.00 V217.40" fill="none" stroke="#006d96" stroke-width="3"/>
<text x="68" y="252" font-size="12">Sample 0</text><text x="815" y="252" font-size="12">7</text>
<text x="28" y="284" font-size="13">Synthetic travel in percent. Stored target: 30. A coarse move crosses it at sample 6.</text>
