<g font-family="system-ui, sans-serif" fill="#172334">
<text x="28" y="34" font-size="21" font-weight="650">Hold the stored value until the knob reaches it</text>
<path d="M28 62h24" stroke="#a84b19" stroke-width="3" stroke-dasharray="6 4"/><text x="60" y="67" font-size="14">Apply every knob sample</text>
<path d="M450 62h24" stroke="#006d96" stroke-width="3"/><text x="482" y="67" font-size="14">Apply after pickup</text>
<path d="M68 104H870 M68 230H870" stroke="#d5dce3" fill="none"/>
<text x="27" y="109" font-size="13">100</text><text x="35" y="235" font-size="13">0</text>
