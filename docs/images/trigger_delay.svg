<title id="title">Keep each delayed trigger until its own deadline</title><desc id="desc">Synthetic cumulative deliveries. A at tick 0, B at tick 1, both delayed 3 ticks; not a timing measurement. Orange: One shared pending mask. Blue: Per-deadline buckets.</desc>
