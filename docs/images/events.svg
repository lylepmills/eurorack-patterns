<svg xmlns="http://www.w3.org/2000/svg" width="920" height="302" viewBox="0 0 920 302" role="img" aria-labelledby="title desc">
<title id="title">Count edges at the acquisition rate, drain them later</title><desc id="desc">Synthetic cumulative events seen by the consumer. Four 2-sample pulses; the consumer reads every third sample. Orange: Level polled every third sample. Blue: Pending edge count.</desc>
