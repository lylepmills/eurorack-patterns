<svg xmlns="http://www.w3.org/2000/svg" width="920" height="302" viewBox="0 0 920 302" role="img" aria-labelledby="title desc">
<title id="title">Finish the running fade, then fade to the newest request</title><desc id="desc">Synthetic cumulative completed fades. Six requests at ticks 0-10, 5-tick fades; restarting finishes nothing while they arrive. Orange: Restart the fade on every request. Blue: Latest request only.</desc>
