name: Measured evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'include/**'
      - 'examples/daisy/**'
      - 'tests/**'
      - 'bench/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/measured.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/fetch_evidence.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEURORACK_PATTERNS_BUILD_BENCH_TESTS=ON -DEURORACK_PATTERNS_BUILD_MEASURED_TESTS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --parallel 2
